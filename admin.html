<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>RAHAT WIZE • Admin</title><style>:root{color-scheme:dark}*{box-sizing:border-box}body{font:16px system-ui;background:#09051b;color:#fff;margin:0;padding:20px}main{max-width:740px;margin:auto}h1{color:#ff5cef}section{background:#17112d;border:1px solid #7848ba;border-radius:16px;padding:18px;margin:18px 0}label{display:block;margin:13px 0;font-size:14px;color:#d8caed}input,textarea{display:block;width:100%;margin-top:5px;border:1px solid #655484;border-radius:9px;background:#09051b;color:#fff;padding:12px;font:inherit}textarea{min-height:90px}button{padding:12px 20px;background:#ad25dd;border:0;border-radius:9px;color:#fff;font:inherit;cursor:pointer;margin:6px 8px 6px 0}button:disabled{opacity:.5}a{color:#5ae5ff}#status{min-height:24px;color:#8fffdc}.hide{display:none}</style></head><body><main><h1>♛ RAHAT WIZE Admin</h1><p><a href="/">← View Website</a></p><section id="login"><h2>Secure Login</h2><form id="loginForm"><label>Username<input name="username" autocomplete="username" required></label><label>Password<input name="password" type="password" autocomplete="current-password" required></label><button>Login</button></form></section><div id="editor" class="hide"><section><h2>Profile</h2><label>Name<input id="name" maxlength="80"></label><label>Bio<textarea id="bio" maxlength="1000"></textarea></label><label>Header Bio<input id="headerBio" maxlength="180"></label><label>Footer Credit<input id="footerCredit" maxlength="120"></label><label>Profile Photo URL<input id="photo"></label><label>Background URL<input id="background"></label><label>Logo URL<input id="logo"></label></section><section><h2>Social Links</h2><div id="links"></div></section><section><h2>Upload Images</h2><p>Photo, background or logo: JPG, PNG, WebP (max 8MB)</p><input id="upload" type="file" accept="image/png,image/jpeg,image/webp"><select id="target"><option value="photo">Profile Photo</option><option value="background">Background</option><option value="logo">Logo</option></select><button id="uploadBtn" type="button">Upload Image</button></section><button id="save" type="button">Save & Publish</button><button id="logout" type="button">Logout</button></div><p id="status" role="status"></p></main><script src="/admin.js" defer></script></body></html>
