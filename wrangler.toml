name = "bio-rahatwize"
main = "worker.js"
compatibility_date = "2026-10-29"

[assets]
directory = "./"
binding = "ASSETS"
run_worker_first = ["/api/*", "/media/*"]

[[kv_namespaces]]
binding = "SETTINGS_KV"
id = "d8cc12bd9ae04ab5a376d0341f41e9a7"

